<svg xmlns="http://www.w3.org/2000/svg" width="640" height="362" viewBox="0 0 640 362" role="img" aria-label="jims-0 wordmark in a terminal window" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="449" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
    .title { font-size: 12px; fill: #8b949e; }
    .prompt { font-size: 14px; fill: #8b949e; }
    .u { fill: #5eead4; }
    .art { font-size: 20px; fill: url(#ink); animation: reveal .45s ease-out both; }
    .foot { font-size: 13px; fill: #8b949e; animation: reveal .5s ease-out both; animation-delay: 2.48s; }
    .cursor { fill: #5eead4; animation: blink 1s steps(1) infinite; animation-delay: 2.88s; }
    .glow { animation: pulse 3.2s ease-in-out infinite; animation-delay: 2.48s; }
    @keyframes reveal { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .82; } }
  </style>

  <rect x="0.5" y="0.5" width="639" height="361" rx="12" fill="url(#bg)" stroke="#30363d"/>
  <line x1="0.5" y1="40" x2="639.5" y2="40" stroke="#21262d"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="6" fill="#27c93f"/>
  <text class="title" x="320.0" y="25" text-anchor="middle">jims-0@github: ~$ ./wordmark.sh --name</text>

  <text class="prompt" x="40" y="68"><tspan class="u">jims-0@github</tspan>:~$ ./wordmark.sh --name</text>

  <g class="glow" filter="url(#glow)">
    <text class="art" x="40" y="100" style="animation-delay:0.90s" xml:space="preserve">   _ _                       ___</text>
    <text class="art" x="40" y="124" style="animation-delay:1.06s" xml:space="preserve">  (_|_)                     / _ \</text>
    <text class="art" x="40" y="148" style="animation-delay:1.22s" xml:space="preserve">   _ _ _ __ ___  ___ ______| | | |</text>
    <text class="art" x="40" y="172" style="animation-delay:1.38s" xml:space="preserve">  | | | &#x27;_ ` _ \/ __|______| | | |</text>
    <text class="art" x="40" y="196" style="animation-delay:1.54s" xml:space="preserve">  | | | | | | | \__ \      | |_| |</text>
    <text class="art" x="40" y="220" style="animation-delay:1.70s" xml:space="preserve">  | |_|_| |_| |_|___/       \___/</text>
    <text class="art" x="40" y="244" style="animation-delay:1.86s" xml:space="preserve"> _/ |</text>
    <text class="art" x="40" y="268" style="animation-delay:2.02s" xml:space="preserve">|__/</text>
  </g>

  <text class="foot" x="40" y="304">Full-Stack Developer · CS Student @ BulSU · Bulacan, PH</text>
  <text class="prompt" x="40" y="334"><tspan class="u">$</tspan></text>
  <rect class="cursor" x="54" y="321" width="9" height="16"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
